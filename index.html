<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Product List with Cart</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-rose-50 font-sans text-gray-800">
    <main class="mx-6 my-12 py-10 md:mx-12 flex md:flex-row flex-col">
      <section class="w-full grid justify-center">
        <div class="mb-6">
          <h1 class="text-2xl md:text-3xl font-bold">Desserts</h1>
        </div>
        <div
          class="card__container w-full grid sm:grid-cols-2 lg:grid-cols-3 sm:gap-16 md:gap-8"
        >
          <!-- Product Card -->
        </div>
      </section>

      <section
        class="bg-white shadow-md md:mr-12 rounded-lg p-6 sm:w-[20rem] md:w-[30rem] h-[max-content]"
      >
        <h2 class="text-2xl font-bold mb-4 text-amber-600">
          Your Cart(<span class="cart__quantity">0</span>)
        </h2>
        <div
          class="shopping__cart-empty flex flex-col gap-2 items-center justify-center"
        >
          <img
            src="assets/images/illustration-empty-cart.svg"
            alt=""
            class="h-full w-full object-cover"
          />
          <div class="text-center">
            <p class="text-gray-600">Your added items will appear here.</p>
          </div>
        </div>
        <div class="shopping__cart hidden">
          <div class="shopping__cart-items">
            <!-- Cart items will be dynamically added here -->
          </div>

          <div class="flex justify-between mt-4 items-center">
            <p class="text-gray-500 text-sm">Order Total</p>
            <p class="text-amber-950 font-bold text-2xl shopping__cart-total">
              $0.00
            </p>
          </div>
          <div
            class="flex justify-center items-center gap-2 p-4 bg-rose-50 my-4 rounded-lg"
          >
            <img
              src="./assets/images/icon-carbon-neutral.svg"
              alt="icon carbon neutral"
            />
            <p class="text-xs">This is a cardbon-neutral delivery</p>
          </div>
          <button
            class="shopping__cart-btn text-white bg-amber-700 active:bg-amber-800 py-4 px-8 my-3 rounded-4xl w-full cursor-pointer"
          >
            Confirm Order
          </button>
        </div>
      </section>

      <!-- Modal Markup -->
      <div
        id="orderModal"
        class="fixed inset-0 flex items-center justify-center hidden"
      >
        <div class="bg-white rounded-lg shadow-lg p-6 md:w-112">
          <div class="flex flex-col items-start gap-2 mb-4">
            <img
              src="./assets/images/icon-order-confirmed.svg"
              alt="Check Icon"
              class="w-16 h-16"
            />
            <h3 class="text-3xl font-bold text-gray-800">Order Confirmed</h3>
            <p class="text-sm text-gray-400">We hope you enjoy your food!</p>
          </div>
          <div class="my-4 flex flex-col gap-3 bg-rose-50 rounded-lg p-4">
            <div class="order-container">
              <!-- populate in js -->
            </div>
          </div>
          <button
            id="closeModalButton"
            class="bg-amber-700 text-white py-2 px-4 rounded-4xl w-full hover:bg-amber-800"
          >
            Start New Order
          </button>
        </div>
      </div>
    </main>

    <footer class="bg-rose-100 py-6 mt-10">
      <div class="container mx-auto px-6 text-center text-sm">
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          class="text-blue-600 hover:underline"
          >Frontend Mentor</a
        >. Coded by
        <a href="#" class="text-blue-600 hover:underline">Collins</a>.
      </div>
    </footer>
  </body>
</html>
